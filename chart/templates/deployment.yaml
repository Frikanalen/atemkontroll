apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atemkontroll.fullname" . }}
  labels:
    {{- include "atemkontroll.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "atemkontroll.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atemkontroll.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ATEM_ADDRESS
              value: {{ required "atemAddress is required" .Values.atemAddress | quote }}
            - name: PORT
              value: "8080"
            {{- with .Values.tokenSecret }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: API_TOKEN
            {{- end }}
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          # Ready even while the mixer is off, so callers get a clear 503
          # from the API instead of a refused connection. /readyz says
          # whether the mixer is connected.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
